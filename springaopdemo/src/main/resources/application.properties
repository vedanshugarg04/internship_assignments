spring.application.name=SpringAOPDemo

server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/company_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/company_nosql_db}

# This lets you see the AOP log messages in your terminal
logging.level.com.example=DEBUG
